<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Correct script tag for jQuery -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/sign-up.js"></script>
</head>
<body>
    <div class="sign-up-form">
        <div class="form-container">
            <h2>Sign Up</h2>
            <form id="signupForm">
                <div>
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" autocomplete="on" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="on" required>
                </div>
                <div>
                    <label for="password2">Password1:</label>
                    <input type="password" id="password1" name="password1" required>
                </div>
                <div>
                    <label for="password2">Confirm Password:</label>
                    <input type="password" id="password2" name="password2" required>
                </div>
                <div>
                    <button type="submit" id="signUpButton">Sign Up</button>
                </div>
                <div id="responseMessage"></div> 
                <div id="success-message"></div><!-- Placeholder for error/success message -->
            </form>
        </div>
    </div>

    <div class="link">
        <p>Already have an account? <a href="sign-in.html">Sign In</a></p> <!-- Link to the sign-in page -->
    </div>

    <script>
        // On form submission, handle the response or show a message
    </script>
</body>
</html>
