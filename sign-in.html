<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="css/styles.css"> <!-- Link to your stylesheet -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/sign-in.js"></script> <!-- Link to your jQuery script -->        
</head>
<body>
    <div class="form-container">
        <h2>Sign In</h2>
        <form id="signinForm">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" autocomplete="on" required>
            </div>
           <!---
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            -->
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <button type="submit" id="sign-in-btn">Sign In</button>
            </div>
            <div id="responseMessage"></div> <!-- Placeholder for error/success message -->
        </form>
        <div class="link">
            <p>Don't have an account? <a href="sign-up.html">Sign Up</a></p>
        </div>
    </div>
</body>
</html>
